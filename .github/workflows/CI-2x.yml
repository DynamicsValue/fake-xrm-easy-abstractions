name: CI-2x

on:
  push:
    branches: [ 2x-dev ]
    paths-ignore:
      - 'coverage/**'
      - '*.md'
      - '*.txt'

env: 
  dotnet-version: 8.0.x
  source-url: "https://nuget.pkg.github.com/${{github.repository_owner}}/index.json"
  GH_HEAD_REF: ${{ github.head_ref }}
  GH_RUN_NUMBER: ${{ github.run_number }}
    
jobs:
  build-windows:
    strategy:
      fail-fast: false 
      matrix: 
        configuration: ['FAKE_XRM_EASY_9', 'FAKE_XRM_EASY_365', 'FAKE_XRM_EASY_2016','FAKE_XRM_EASY_2015','FAKE_XRM_EASY_2013','FAKE_XRM_EASY']

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET Core for Actual Source
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.dotnet-version }}
 
    - name: Disable local packages feed
      run: dotnet nuget disable source "local-packages"

    - name: Enable GitHub packages feed
      run: dotnet nuget enable source github
      
    - name: Build
      run: pwsh ./build.ps1 -configuration ${{matrix.configuration}} -targetFrameworks 'all'
      env: 
        NUGET_USERNAME: ${{ github.repository_owner }}
        NUGET_TOKEN: ${{ secrets.PACKAGES_TOKEN }} 

  pack-push:
    needs:  [build-windows]
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET Core for Actual Source
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.dotnet-version }}
 
      - name: Disable local packages feed
        run: dotnet nuget disable source "local-packages"

      - name: Enable GitHub packages feed
        run: dotnet nuget enable source github 

      - name: Build
        run: pwsh ./build.ps1 -targetFrameworks 'all'
        env: 
          NUGET_USERNAME: ${{github.repository_owner}}
          NUGET_TOKEN: ${{ secrets.PACKAGES_TOKEN }}

      - name: Pack Src
        shell: powershell
        run: pwsh ./pack-src.ps1 -targetFrameworks 'all' -versionSuffix "zci.$env:GH_HEAD_REF$env:GH_RUN_NUMBER"
        env: 
          NUGET_USERNAME: ${{github.repository_owner}}
          NUGET_TOKEN: ${{ secrets.PACKAGES_TOKEN }}

      - name: Push Src
        shell: powershell
        run: dotnet nuget push .\nupkgs\FakeXrmEasy.Abstractions.*.nupkg --api-key $env:NUGET_TOKEN -s ${{ env.source-url }}
        env: 
          NUGET_USERNAME: ${{github.repository_owner}}
          NUGET_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Pack Tests
        shell: powershell
        run: pwsh ./pack-tests.ps1 -targetFrameworks 'all' -versionSuffix "zci.$env:GH_HEAD_REF$env:GH_RUN_NUMBER"
        env: 
          NUGET_USERNAME: ${{github.repository_owner}}
          NUGET_TOKEN: ${{ secrets.PACKAGES_TOKEN }}

      - name: Push Tests
        shell: powershell
        run: dotnet nuget push .\nupkgs\FakeXrmEasy.AbstractionsTests.*.nupkg --api-key $env:NUGET_TOKEN -s ${{ env.source-url }}
        env: 
          NUGET_USERNAME: ${{github.repository_owner}}
          NUGET_TOKEN: ${{ secrets.GITHUB_TOKEN }}
